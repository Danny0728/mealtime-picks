name: Weekly fetch

on:
  schedule:
    # Sundays 22:37 UTC = Monday 04:07 IST, so the new list is ready for the week.
    - cron: "37 22 * * 0"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: fetch
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # The pipeline's memory lives on its own branch (one commit, force-pushed)
      # so main's history doesn't grow by a few MB every week.
      - name: Restore pipeline state
        run: |
          mkdir -p data
          if git ls-remote --exit-code --heads origin pipeline-state >/dev/null; then
            git fetch origin pipeline-state
            git show origin/pipeline-state:state.json > data/state.json || true
          fi

      - uses: actions/setup-go@v5
        with:
          go-version-file: fetcher/go.mod

      - name: Run fetcher
        working-directory: fetcher
        env:
          TMDB_TOKEN: ${{ secrets.TMDB_TOKEN }}
          REDDIT_CLIENT_ID: ${{ secrets.REDDIT_CLIENT_ID }}
          REDDIT_CLIENT_SECRET: ${{ secrets.REDDIT_CLIENT_SECRET }}
          REDDIT_USER_AGENT: ${{ secrets.REDDIT_USER_AGENT }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          INSTAGRAM_TOKEN: ${{ secrets.INSTAGRAM_TOKEN }}
          INSTAGRAM_USER_ID: ${{ secrets.INSTAGRAM_USER_ID }}
        run: |
          go run ./cmd/fetcher \
            -config config.json \
            -state ../data/state.json \
            -feedback ../data/feedback.json \
            -out ../web/public/catalog.json \
            -timeout 50m

      - name: Save pipeline state
        run: |
          git config --global user.name "mealtime-bot"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          tmp=$(mktemp -d)
          cp data/state.json "$tmp/state.json"
          cd "$tmp"
          git init -q -b pipeline-state
          git add state.json
          git commit -qm "Pipeline state $(date -u +%F)"
          git push -q --force "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" pipeline-state

      - name: Commit catalog
        run: |
          git add web/public/catalog.json
          if git diff --cached --quiet; then
            echo "Catalog unchanged"
          else
            git commit -m "Weekly catalog $(date -u +%F)"
            git push
          fi

  # Pushes made by this workflow don't trigger other workflows, so deploy here.
  deploy:
    needs: fetch
    uses: ./.github/workflows/deploy.yml
