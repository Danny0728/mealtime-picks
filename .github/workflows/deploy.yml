name: Test and deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call: # the weekly fetch calls this after updating the catalog

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: fetcher/go.mod
      - name: Go tests
        working-directory: fetcher
        run: go vet ./... && go test ./...
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Web tests
        working-directory: web
        run: npm ci && npm test

  deploy:
    if: github.event_name != 'pull_request'
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.pages.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main # pick up the catalog the weekly fetch just committed
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Build
        working-directory: web
        run: |
          # Pages serves the site under /<repo>/
          export BASE_PATH="/${GITHUB_REPOSITORY#*/}/"
          npm ci && npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist
      - id: pages
        uses: actions/deploy-pages@v4
